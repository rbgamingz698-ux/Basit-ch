    <script>
      (function() {
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            if (typeof url === 'string' && (url.includes('vite') || url.includes('3000') || url.includes('localhost') || url.includes('127.0.0.1') || url.includes('ws'))) {
              return {
                url: url,
                readyState: 3, // CLOSED
                bufferedAmount: 0,
                extensions: "",
                protocol: protocols || "",
                binaryType: "blob",
                send: function() {},
                close: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null
              };
            }
            return new OriginalWebSocket(url, protocols);
          };
          Object.setPrototypeOf(window.WebSocket, OriginalWebSocket);
          window.WebSocket.prototype = OriginalWebSocket.prototype;
        }
      })();
    </script>
